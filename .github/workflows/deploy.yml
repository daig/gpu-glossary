name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  # Quartz v5 branch, 2026-09-20
  QUARTZ_REF: 97a2d05f80c4c50534959b1d0d41cc4b3895625e

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out vault
        uses: actions/checkout@v4
        with:
          path: vault
          fetch-depth: 0 # full history for created/modified dates

      - name: Check out Quartz
        uses: actions/checkout@v4
        with:
          repository: jackyzha0/quartz
          ref: ${{ env.QUARTZ_REF }}
          path: quartz

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: quartz/package-lock.json

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Configure Quartz
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          cp vault/.quartz/quartz.config.yaml quartz/quartz.config.yaml
          sed -i "s|^  baseUrl: .*|  baseUrl: ${BASE_URL#*://}|" quartz/quartz.config.yaml

      - name: Install Quartz and plugins
        working-directory: quartz
        run: npm ci

      - name: Build site
        working-directory: quartz
        run: npx quartz build -d ../vault

      - uses: actions/upload-pages-artifact@v3
        with:
          path: quartz/public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
